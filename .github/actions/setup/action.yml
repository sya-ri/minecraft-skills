name: Setup workspace
description: Install the pinned toolchain and restore the pnpm dependency store

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@v4.2.0
      with:
        install: true
        cache: true

    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml') }}-

    # A store hit only supplies package contents; always validate the lockfile
    # and recreate this checkout's node_modules links.
    - name: Install dependencies
      shell: bash
      run: mise exec -- pnpm install --frozen-lockfile --prefer-offline

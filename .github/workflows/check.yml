name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4.2.0
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Check
        run: CI=true mise exec -- pnpm run check

      - name: Pack dry run
        run: mise exec -- pnpm run pack:dry-run

      - name: Package smoke
        run: mise exec -- pnpm run pack:smoke
